schema_version: 1
runtime: transform
id: mask-secrets
chip: mask-secrets
title: Mask secrets and tokens
icon: EyeOff
description: Redact API keys, Bearer tokens, DB URLs, and credentials from text before feeding to AI models
emits: Generic
placeholder_examples:
  - "Authorization: Bearer my-secret-token"
  - "DATABASE_URL=postgres://user:password@host:5432/db"

presentation:
  widget: detail

transform:
  pipe:
    - lines
    - replace: { from: "Bearer\\s+[a-zA-Z0-9_\\-\\.]+", to: "Bearer [REDACTED_TOKEN]", flags: "g" }
    - replace: { from: "\\b(sk-[a-zA-Z0-9_\\-]{20,})\\b", to: "[OPENAI_KEY_REDACTED]", flags: "g" }
    - replace: { from: "\\b(AKIA[0-9A-Z]{16})\\b", to: "[AWS_KEY_REDACTED]", flags: "g" }
    - replace: { from: "\\b(gh[pousr]_[a-zA-Z0-9]{36,})\\b", to: "[GITHUB_TOKEN_REDACTED]", flags: "g" }
    - replace: { from: "\\b([sr]k_live_[0-9a-zA-Z]{24,})\\b", to: "[STRIPE_KEY_REDACTED]", flags: "g" }
    - replace: { from: "https:\\/\\/hooks\\.slack\\.com\\/services\\/[A-Za-z0-9_\\/]+", to: "https://hooks.slack.com/services/[SLACK_WEBHOOK_REDACTED]", flags: "g" }
    - replace: { from: "(postgres|postgresql|mysql|mongodb|redis):\\/\\/([^\\s:]+):(.*?)@([a-zA-Z0-9.\\-_]+(?::\\d+)?\\/)", to: "$1://$2:[REDACTED_PASSWORD]@$4", flags: "gi" }
    - replace: { from: "([\"']?(?:password|passwd|secret|api_key|access_token)[\"']?\\s*[:=]\\s*[\"'])(?:[^\"'\\r\\n]+)([\"'])", to: "$1[REDACTED]$2", flags: "gi" }
    - redact_secrets
